name: networks.geocalib_improve

ll_enc:
  name: encoders.low_level_encoder

backbone:
  name: encoders.mscan
  weights: weights/mscan_b.pth

perspective_decoder:
  name: decoders.perspective_decoder_improve

  up_decoder:
    name: decoders.up_decoder_improve
    loss_type: l1
    use_uncertainty_loss: true
    decoder:
      name: decoders.light_hamburger_improve
      predict_uncertainty: true

  latitude_decoder:
    name: decoders.latitude_decoder_improve
    loss_type: l1
    use_uncertainty_loss: true
    decoder:
      name: decoders.light_hamburger_improve
      predict_uncertainty: true

optimizer:
  name: optimization.lm_optimizer
  camera_model: pinhole
